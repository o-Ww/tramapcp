<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assista e Conecte-se</title>
<style>
  :root {
    --bg: #f4f5f7;
    --bg-glow: rgba(47, 91, 234, 0.12);
    --fg: #14161a;
    --muted: #5d6470;
    --card: #ffffff;
    --line: #e1e4ea;
    --accent: #2f5bea;
    --shadow: 0 10px 40px rgba(20, 22, 26, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #624010;
      --bg-glow: rgba(111, 143, 255, 0.16);
      --fg: #f1f2f4;
      --muted: #9aa1ad;
      --card: #171a20;
      --line: #2a2e37;
      --accent: #6f8fff;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    }
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 500px at 50% -10%, var(--bg-glow), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }

  .wrap { width: 100%; max-width: 720px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: clamp(20px, 5vw, 36px);
  }

  .screen[hidden] { display: none; }
  .screen { animation: fade .35s ease; }
  @keyframes fade {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  /* Logo */
  .brand {
    display: flex;
    justify-content: center;
    background: #624010;
    border-radius: 14px;
    padding: 20px 24px;
    margin-bottom: 22px;
  }
  .brand[hidden] { display: none; }
  .brand img {
    display: block;
    width: 100%;
    max-width: 240px;
    max-height: 150px;
    height: auto;
    object-fit: contain;
  }

  h1 {
    font-size: clamp(1.5rem, 4.5vw, 2rem);
    margin: 0 0 8px;
    text-align: center;
    text-wrap: balance;
    letter-spacing: -0.02em;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 28px;
    text-align: center;
    font-size: 1.05rem;
  }

  /* Vídeo */
  .player-box {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #624010;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
  }
  .player-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; }

  .actions { display: flex; justify-content: center; margin-top: 18px; }

  .skip {
    font: inherit;
    font-weight: 600;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 24px;
    cursor: pointer;
    transition: border-color .2s, color .2s, transform .2s;
  }
  .skip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .skip:focus-visible, .link-btn:focus-visible, .replay:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }

  /* Botões finais */
  .links { display: grid; gap: 12px; }
  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 1.05rem;
    text-decoration: none;
    color: #fff;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.14);
    transition: transform .2s, box-shadow .2s, filter .2s;
  }
  .link-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.2);
    filter: brightness(1.06);
  }
  .link-btn:active { transform: translateY(0); }
  .link-btn svg { width: 26px; height: 26px; flex: none; }
  .link-btn .txt { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
  .link-btn .txt small {
    font-weight: 500;
    font-size: .8rem;
    opacity: .9;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .link-btn .arrow { margin-left: auto; opacity: .8; font-size: 1.2rem; }

  .instagram { background: linear-gradient(45deg, #624010, #dc2743 55%, #bc1888); }
  .whatsapp  { background: #1faa59; }
  .email     { background: var(--accent); }
  @media (prefers-color-scheme: dark) { .email { color: #0e1014; } }

  .replay {
    display: block;
    margin: 24px auto 0;
    background: none;
    border: 0;
    padding: 4px;
    font: inherit;
    font-size: .95rem;
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .replay:hover { color: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    .screen { animation: none; }
    .link-btn, .skip { transition: none; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="card">

      <!-- Logo (aparece nas duas telas) -->
      <div class="brand" id="brand">
        <img id="logo" alt="Trama PCP" width="524" height="388" decoding="async">
      </div>

      <!-- Tela 1: vídeo -->
      <section id="screen-video" class="screen">
        <div class="player-box"><div id="player"></div></div>
        <div class="actions">
          <button class="skip" id="skip" type="button">Pular vídeo</button>
        </div>
      </section>

      <!-- Tela 2: botões -->
      <section id="screen-links" class="screen" hidden>
        <h1>Fale com a gente</h1>
        <p class="sub">busque a mudança.</p>
        <div class="links">

          <a class="link-btn instagram" id="btn-instagram" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5"/>
              <circle cx="12" cy="12" r="4"/>
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
            </svg>
            <span class="txt">Instagram</span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>

          <a class="link-btn whatsapp" id="btn-whatsapp" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.4L3 21z"/>
              <path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.2-1.4-2-1-.9.7c-.8-.4-1.5-1.1-1.9-1.9l.7-.9-1-2L9 9.5z" fill="currentColor" stroke="none"/>
            </svg>
            <span class="txt">WhatsApp</span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>

          <a class="link-btn email" id="btn-email">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="3"/>
              <path d="M4 7l8 6 8-6"/>
            </svg>
            <span class="txt">Enviar e-mail<small id="email-text"></small></span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>

        </div>
        <button class="replay" id="replay" type="button">Assistir o vídeo de novo</button>
      </section>

    </div>
  </main>

<script>
  // ====== CONFIGURE AQUI ======
  const CONFIG = {
    logo: LOGO_DATA,                      // logo embutida; para trocar, use um caminho/URL, ex: "logo.png"
    videoId: "lHlu81ClZI4",              // o que vem depois de "v=" no link do YouTube
    start: 0,                             // segundo em que o vídeo começa (opcional)
    end: 0,                               // segundo em que o vídeo termina (0 = até o fim)
    instagram: "https://www.instagram.com/tramapcp/",
    whatsapp: "https://wa.me/5511988971599?text=Ol%C3%A1!",  // número com DDI + DDD, só dígitos
    email: "victoria@tramapcp.com",
    emailSubject: "Contato pelo site"
  };
  // ============================

  const screenVideo = document.getElementById("screen-video");
  const screenLinks = document.getElementById("screen-links");
  let player = null;

  // Logo: se a imagem não carregar, esconde o espaço dela
  const logo = document.getElementById("logo");
  logo.addEventListener("error", function () {
    document.getElementById("brand").hidden = true;
  });
  logo.src = CONFIG.logo;

  document.getElementById("btn-instagram").href = CONFIG.instagram;
  document.getElementById("btn-whatsapp").href = CONFIG.whatsapp;
  document.getElementById("btn-email").href =
    "mailto:" + CONFIG.email + "?subject=" + encodeURIComponent(CONFIG.emailSubject);
  document.getElementById("email-text").textContent = CONFIG.email;

  function showLinks() {
    if (player && player.pauseVideo) player.pauseVideo();
    screenVideo.hidden = true;
    screenLinks.hidden = false;
  }

  function showVideo() {
    screenLinks.hidden = true;
    screenVideo.hidden = false;
    if (player && player.seekTo) {
      player.seekTo(CONFIG.start || 0, true);
      player.playVideo();
    }
  }

  document.getElementById("skip").addEventListener("click", showLinks);
  document.getElementById("replay").addEventListener("click", showVideo);

  // Carrega a API de iframe do YouTube
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady = function () {
    const vars = { rel: 0, modestbranding: 1, playsinline: 1 };
    if (CONFIG.start) vars.start = CONFIG.start;
    if (CONFIG.end) vars.end = CONFIG.end;

    player = new YT.Player("player", {
      videoId: CONFIG.videoId,
      playerVars: vars,
      events: {
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.ENDED) showLinks();
        }
      }
    });
  };

  screenVideo.hidden = false;
</script>
